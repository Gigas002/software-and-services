# Redirect Valve's 32-bit `reaper` (Steam Runtime 1 build, still shipped in
# steamrt64/ and ubuntu12_32/) to a native 64-bit build, so launching games
# needs no 32-bit glibc. The magic is the full 52-byte ELF header of that exact
# binary, so no other 32-bit executable is affected.
# See https://github.com/ValveSoftware/steam-for-linux/issues/13015
:steam-reaper:M:0:\x7f\x45\x4c\x46\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x03\x00\x01\x00\x00\x00\x18\x86\x04\x08\x34\x00\x00\x00\xa8\x11\x00\x00\x00\x00\x00\x00\x34\x00\x20\x00\x09\x00\x28\x00\x1e\x00\x1b\x00::/usr/lib/steam/reaper64:F
