name = "dwproton"
runner = "proton"
# Proton's compat data dir. umu made it, so pfx/ is a symlink to the dir itself.
prefix = "~/prefixes/dwproton"

[proton]
build = "/usr/share/steam/compatibilitytools.d/dwproton"

[env]
PROTON_FSR4_UPGRADE = "0"
PROTON_USE_OPTISCALER = "0"
PROTON_USE_WOW64 = "1"
PROTON_ENABLE_WAYLAND = "1"
MESA_LOADER_DRIVER_OVERRIDE = "zink"
PROTON_NO_WM_DECORATIONS = "0"
