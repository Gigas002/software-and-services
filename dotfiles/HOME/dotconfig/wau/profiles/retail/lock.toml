%20Added%20a%20/tomtomway%20command%20to%20get%20around%20Cartographer%20clobbering%20everything%20I%20set%0D%0A%20%20%20%20%2A%20Changed%20the%20global%20I%20use%20for%20slash%20commands%2C%20the%20previous%20one%20was%20ill-advised%0D%0A%5B%2A%5DStop%20the%20SetScale%20error%20from%20being%20thrown%20temporarily%0D%0A%5B%2A%5D%2A%20Updated%20deDE%20localization%20courtesy%20of%20Elto%40Kil%27jaeden%0D%0A%20%20%20%20%2A%20Localized%20the%20crazy%20arrow%27s%20distance%20indication%0D%0A%5B%2A%5DFix%20an%20error%20that%20could%20occur%20when%20right-clicking%20a%20waypoint%20after%20setting%20it%2C%20without%20ReloadWaypoints%20having%20been%20called%0D%0A%5B%2A%5D%2A%20Added%20an%20option%20to%20%22disable%20clicks%22%20on%20the%20crazy%20taxi%20arrow%20entirely%2C%20so%20you%20can%20have%20clicks%20pass%20through%0D%0A%20%20%20%20%2A%20Added%20an%20option%20to%20change%20the%20scale%20of%20the%20crazy%20arrow%20title%20text%0D%0A%20%20%20%20%2A%20Added%20an%20option%20to%20change%20the%20alpha%20of%20the%20crazy%20arrow%20title%20text%0D%0A%5B%2A%5D%2A%20Instead%20of%20displaying%20nothing%20and%20erroring%20OnUpdate%2C%20just%20display%20%22Unknown%20Distance%22%0D%0A%5B%2A%5DDon%27t%20display%20distance%20on%20the%20tooltip%20when%20we%20can%27t%20calculate%20it%0D%0A%5B%2A%5D%2A%20Fixed%20an%20issue%20that%20prevented%20Modifier-RightClicking%20on%20the%20world%20map%20from%20setting%20a%20new%20waypoint%0D%0A%5B%2A%5D%2A%20Don%27t%20automatically%20open%20the%20TomTom%20dialog%20when%20opening%20the%20Interface%20Options%20frame%0D%0A%20%20%20%20%2A%20Add%20ruRU%20localization%2C%20thanks%20to%20Swix%0D%0A%5B%2A%5D%2A%20Removed%20Wrath%20compatibility%20code%0D%0A%20%20%20%20%2A%20TomTom%20options%20will%20now%20be%20created%20automatically%20when%20the%20interface%20options%20frame%20is%20opened%0D%0A%5B%2A%5DFixed%20the%20moved%20AceConfig%20externals%2C%20and%20fix%20the%20/tomtom%20slash%20command%0D%0A%5B%2A%5D%2A%20Updated%20version%20of%20Astrolabe%20to%20fix%20resize%20issue%20with%20EP/SW%0D%0A%20%20%20%20%2A%20Updated%20interface%20version%20number%0D%0A%20%20%20%20%2A%20Moved%20LibStub%20from%20an%20external%20to%20a%20static%20file%20%28no%20user%20impact%29%0D%0A%5B%2A%5DDon%27t%20hide%20icons%20that%20are%20disabled%2C%20so%20they%20still%20get%20callbacks%0D%0A%5B%2A%5DFixes%20an%20issue%20that%20prevented%20the%20%22Reset%20waypoints%22%20command%20from%20working%0D%0A%5B%2A%5DUpdated%20to%20a%20beta-compatible%20version%20of%20Astrolabe%0D%0A%5B%2A%5DAltered%20the%20configuration%20options%20to%20always%20use%20the%20Blizz%20UI%20panel%0D%0A%5B%2A%5DReverting%20to%20prior%20version%20of%20Astrolabe%0D%0A%5B%2A%5DFixed%20some%20of%20the%20bugs%20that%20exist%2C%20while%20breaking%20new%20features.%0D%0A%20%20%20%20%20%20%2A%20The%20option%20to%20disable%20waypoints%20from%20other%20zones%20on%20the%20world%20and%20minimap%20is%20disabled%2C%20since%20it%27s%20broken%20in%20pieces%20right%20now%0D%0A%5B%2A%5DFixed%20a%20number%20of%20massive%20bugs%20in%20TomTom%27s%20zoning%20code%0D%0A%5B%2A%5DFixed%20a%20bug%20that%20cause%20new%20waypoints%20to%20not%20respect%20the%20Enable%20World%20and%20Enable%20Minimap%20options%0D%0A%5B%2A%5DFixing%20TomTom%20in%20wrath%2C%20using%20IsWrathBuild%28%29%0D%0A%5B%2A%5DAdded%20/tway%20as%20a%20slash%20command%20for%20TomTom%27s%20waypoint%20command%2C%20to%20avoid%20conflicts%20with%20Cartographer%0D%0A%5B%2A%5DFixed%20an%20issue%20with%20the%20graphics%20on%20the%20waypoint%20arrow%2C%20thanks%20Krill3%20for%20the%20report.%0D%0A%5B%2A%5DAdded%20zhCN%20localization%20thanks%20to%20Onlyfly%20and%20fixed%20some%20non-native%20line%20endings%0D%0A%5B%2A%5DAdded%20an%20option%20to%20reset%20the%20waypoint%20arrow%20location%2C%20and%20a%20toggle%20for%20waypoints%20announcements%0D%0A%5B%2A%5DDon%27t%20clear%20waypoints%20when%20you%20are%20on%20a%20taxi%0D%0A%5B%2A%5DAdded%20an%20option%20to%20change%20the%20world-map%20click%20modifier%0D%0A%5B%2A%5DFixed%20a%20bug%20with%20the%20/way%20slash%20command%2C%20when%20used%20without%20arguments%0D%0A%5B%2A%5DAlter%20TomTom%20to%20use%20Astrolabe%20trunk%0D%0A%5B%2A%5DAdded%20an%20option%20to%20change%20the%20title%20height/width%20of%20the%20crazy%20arrow%0D%0A%5B/list%5D"
