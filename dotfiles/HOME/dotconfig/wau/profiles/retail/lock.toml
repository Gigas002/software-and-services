description = """
TomTom is your personal navigation assistant in World of Warcraft. This addon is very simple, but provides a nice set of functionality.
Thank you to:
[LIST]
[*]Esamynn for Astrolabe which did the heavy lifting in this addon before Blizzard changed the mapping system
[*]Nevcairiel for HereBeDragons, which does the heavy lifting these days
[*]Carl Thomas and Chris Braithwaite for their contributions of the new lovely artwork and themes
[*]Ludovicus for maintaining during my days away from WoW[/LIST][B]New Updates[/B]
As we head into Midnight we've been able to give TomTom a fresh coat of paint, thanks to some lovely community members. There are now theme customizations for the Crazy Arrow, and for both the Minimap and Worldmap waypoints. Just run /tomtom to open the options and navigate to the section to preview and select a theme.
[B]Features[/B]
TomTom offers the following major features:
[LIST]
[*]Set waypoints via command, or by clicking on the world map
[*]Set multiple waypoints at a time (such as those you can copy and paste from WowHead)
[*]A draggable coordinate display with customizable accuracy. This frame can be hidden or locked.
[*]Player and cursor coordinates on the World Map (these can be hidden)
[*]A floating "crazy-taxi" style arrow that points you to your destination
[*]Displaying the "crazy-taxi" arrow or coordinate block in compatible LDB displays, such as [URL="http://www.wowinterface.com/downloads/info11884-NinjaPanel.html"]NinjaPanel[/URL]
[*]Show a waypoint that points you towards your corpse for easy recovery
[*]Can set waypoints by clicking on quest objective POIs on the World Map and watch frame.[/LIST][B]Slash Commands:[/B]
/tomtom - Opens configuration GUI
/ttpaste - Opens a window where you can paste a list of /way commands, such as those you might copy from WowHead, and have them all added in one go!
In addition you can use the /way command to add and reset waypoints. In order to overcome conflicts with the Cartographer /way command, you can also use /tway to access TomTom's waypoint command. The following slash commands are available:
Slash CommandDescription /tway 14.78 23.9Add a new waypoint at 14.78, 23.90 /tway Nagrand 45 50Add a new waypoint in Nagrand at 45, 50 /tway 14.78 23.90 This is a waypoint!Add a new waypoint with a description /tway reset allRemove ALL current waypoints /tway reset NagrandRemove all waypoints in Nagrand /wayb or /waybackSets a waypoint at the current location /cway or /closestwaySet the crazy arrow to the closest waypoint/tway listList the current known waypoints/tway arrowPrint the status of the Crazy Arrow
TomTom has been designed to publish the Crazy-Arrow and Coordinate Block as LDB feeds, allowing them to be displayed in compatible display addons. I've written a very simple, easy-to-configure panel that is capable of displaying these called [URL="http://www.wowinterface.com/downloads/info11884-NinjaPanel.html#info"]NinjaPanel[/URL].
If you're looking to bulk import waypoints (to track achievements, etc), use the /ttpaste command to open an easy bulk create waypoint window.
[B][U]Donations:[/U][/B]
Some folks have asked for how they can donate money, and for many years I've enjoyed hearing about how my addons have helped other people enjoy World of Warcraft. If you would like to donate, I'd ask you to make a donation to the [URL="https://www.ccalliance.org/donate"]Colorectal Cancer Alliance[/URL], a worthy organisation that helped my sister immensely from her diagnosis through her final years. If you or a family member suspect you might have something not right in your butt, please have a doctor check it out. Colorectal cancer is one of the most preventable cancers in the world."""
