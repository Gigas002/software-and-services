e%20TOCs%20for%2010.1.7%20and%201.14.4%0D%0A%2A%20Add%20Multi%20Action%20Burs%20to%20the%20default%20Action%20Bars%20rule%0D%0A%0D%0A%23%23%2010.1.1%0D%0A%0D%0A%2A%20Update%20TOCs%20for%203.4.3%0D%0A%0D%0A%23%23%2010.1.0%0D%0A%0D%0A%2A%20Update%20TOCs%20for%2010.1.0%0D%0A%0D%0A%23%23%2010.0.5%0D%0A%0D%0A%2A%20Update%20TOCs%20for%2010.0.7%0D%0A%0D%0A%23%23%2010.0.4%0D%0A%0D%0A%2A%20Update%20TOCs%20for%2010.0.5%0D%0A%0D%0A%23%23%2010.0.3%0D%0A%0D%0A%2A%20Update%20TOCs%20for%203.4.1%0D%0A%0D%0A%23%23%2010.0.2%0D%0A%0D%0A%2A%20Update%20TOCs%20for%2010.0.2%0D%0A%2A%20NOTE%3A%20OmniCC%27s%20options%20menu%20is%20now%20no%20longer%20a%20part%20of%20the%20main%20options%20menu%2C%0D%0A%20%20to%20avoid%20issues%20introduced%20with%20Dragonflight%27s%20UI%20changes.%20To%20bring%20up%20the%0D%0A%20%20options%20menu%2C%20use%20either%20the%20/omnicc%20or%20/occ%20slash%20commands.%0D%0A%0D%0A%23%23%2010.0.1%0D%0A%0D%0A%2A%20Tagging%20as%20release%0D%0A%0D%0A%23%23%2010.0.0%0D%0A%0D%0A%2A%20Update%20TOCs%20for%2010.0.0%0D%0A%0D%0A%23%23%209.2.1%0D%0A%0D%0A%2A%20Updated%20TOCs%20for%209.2.5%2C%203.4.0%2C%202.5.4%2C%20and%201.14.3.%0D%0A%0D%0A%23%23%209.2.0%0D%0A%0D%0A%2A%20Updated%20TOCs%20for%209.2.0%2C%202.5.3%2C%20and%201.14.2%0D%0A%0D%0A%23%23%209.1.6%0D%0A%0D%0A%2A%20Whoops%2C%20I%20forgot%20that%209.1.5%20introduced%20a%20new%20Maximum%20Cooldown%20Duration%20setting%20%28thanks%20Lyrex%29%0D%0A%2A%20Setting%20the%20maximum%20duration%20slider%20to%200%20will%20enable%20cooldowns%20of%20any%20duration%0D%0A%2A%20Adjusted%20default%20for%20max%20duration%20to%20be%200%20instead%20of%20600%0D%0A%0D%0A%23%23%209.1.5%0D%0A%0D%0A%2A%20TOC%20updates%20for%201.14.1%20and%209.1.5%0D%0A%0D%0A%23%23%209.1.0%0D%0A%0D%0A%2A%20TOC%20updates%20for%20WoW%209.1.0%0D%0A%0D%0A%23%23%209.0.10%0D%0A%0D%0A%2A%20Update%20TOCs%20for%20Burning%20Crusade%20Classic%0D%0A%0D%0A%23%23%209.0.9%0D%0A%0D%0A%2A%20Update%20TOCs%20for%201.13.7%0D%0A%0D%0A%23%23%209.0.8%0D%0A%0D%0A%2A%20The%20cooldown%20opacity%20setting%20is%20now%20only%20applied%20when%20set%20at%20an%20opacity%20value%20under%20100%25%0D%0A%2A%20Update%20TOCs%20values%20for%209.0.5%0D%0A%0D%0A%23%23%209.0.7%0D%0A%0D%0A%2A%20Updated%20Korean%20translation%20%28thanks%2C%20WetU%29%0D%0A%2A%20Updated%20Russian%20translation%20%28thanks%20mone-ennen%29%0D%0A%2A%20Fixed%20an%20issue%20when%20upgrading%20from%20OmniCC%20versions%20prior%20to%208.1%20or%20so%0D%0A%2A%20Added%20a%20setting%20to%20disable%20auto%20disabling%20of%20blizzard%20cooldown%20text%20%60/run%20OmniCC.db.global.disableBlizzardCooldownText%20%3D%20false%3B%20ReloadUI%28%29%60%0D%0A%0D%0A%23%23%209.0.6%0D%0A%0D%0A%2A%20Replaced%20the%20Draw%20Cooldown%20Swipes%20with%20a%20Cooldown%20Opacity%20slider%0D%0A%2A%20Updated%20Russian%20Localization%20%28thanks%2C%20Artur91425%29%0D%0A%0D%0A%23%23%209.0.5%0D%0A%0D%0A%2A%20Update%20TOCs%20for%201.13.6%0D%0A%2A%20Add%20a%20nil%20check%20when%20deciding%20to%20hide%20cooldown%20spirals%20or%20not%0D%0A%2A%20Build%20process%20updates%0D%0A%0D%0A%23%23%209.0.4%0D%0A%0D%0A%2A%20Updated%20TOCs%20for%209.0.2%0D%0A%0D%0A%23%23%209.0.3%0D%0A%0D%0A%2A%20Fix%20cases%20where%20cooldowns%20may%20not%20properly%20refresh%0D%0A%0D%0A%23%23%209.0.2%0D%0A%0D%0A%2A%20Fixed%20an%20error%20for%20when%20OmniCC%20attempts%20to%20display%20configuration%20for%20rules%20with%20missing%20id%20values%0D%0A%0D%0A%23%23%209.0.1%0D%0A%0D%0A%2A%20Apply%20default%20rulesets%20only%20when%20a%20profile%20is%20first%20created.%20This%20fixes%20an%20issue%20with%20deleting%20the%20defaults.%0D%0A%0D%0A%23%23%209.0.0%0D%0A%0D%0A%2A%20Finish%20effects%20will%20now%20trigger%20immediately%20for%20cooldowns%20that%20are%20soon%20to%20complete%2C%20but%20were%20overridden%20by%20the%20GCD.%0D%0A%2A%20Added%20a%20new%20setting%2C%20Timer%20Offset%2C%20to%20adjust%20the%20end%20point%20for%20timers%20to%20account%20for%20things%20like%20spell%20queue%20windows%20and%20latency.%0D%0A%2A%20Added%20predefined%20rules%20for%20Action%2