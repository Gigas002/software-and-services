version = "spoken/v3.7.0"
changelog_url = "data:,%23%23%203.7.0%20%E2%80%94%202026-10-31%0A%0A-%20%2A%2AWorld%20Chatter%20voices%20what%20people%20say%20out%20loud%20in%20the%20world.%2A%2A%20Guards%2C%20farmers%20and%20others%20who%20talk%0A%20%20without%20a%20quest%20are%20matched%20by%20who%20says%20what%2C%20and%20the%20line%20plays%20when%20a%20voice%20pack%20has%20it%2C%20only%20when%0A%20%20nothing%20else%20is%20being%20read.%20The%20game%27s%20chat%20bubble%20stays%20the%20only%20thing%20on%20screen%2C%20and%20lights%20the%20word%0A%20%20being%20read.%20It%20is%20a%20part%20of%20its%20own%20on%20Spoken%27s%20page%2C%20with%20a%20switch%20and%20a%20page%2C%20and%20%60/spq%20chatter%60%0A%20%20replays%20an%20NPC%27s%20lines.%20%2A%28%5BNucabe%5D%28https%3A//github.com/Nucabe%29%29%2A%0A-%20%2A%2ASpoken%20NPCs%20is%20now%20Spoken%20Bosses.%2A%2A%20The%20module%20has%20a%20new%20name%20and%20folder%2C%20%60Spoken_Bosses%60%2C%20so%0A%20%20the%20bosses%20you%20found%20and%20the%20stories%20already%20told%20start%20over.%20An%20old%20%60Spoken_NPCs%60%20folder%20left%0A%20%20beside%20it%20is%20switched%20off%2C%20and%20Spoken%20offers%20the%20reload%20that%20finishes%20it.%0A%20%20%2A%28%5Brusty-key%5D%28https%3A//github.com/rusty-key%29%29%2A%0A-%20%2A%2ABoss%20stories%20are%20read%20aloud.%2A%2A%20Install%20Spoken%20Audio%3A%20Places%20and%20Bosses%20and%20a%20boss%27s%20story%20is%20voiced%20when%20it%20falls%3B%20without%20it%20the%20story%20shows%20as%20text%2C%20as%20before.%0A%20%20The%20Bosses%20settings%20page%20lists%20the%20pack%2C%20with%20the%20address%20to%20download%20it%2C%20as%20the%20Places%20and%0A%20%20Readables%20pages%20list%20theirs.%20Play%20on%20a%20boss%27s%20page%20in%20the%20Compendium%20plays%20its%20story%2C%20and%20the%0A%20%20boss%20still%20tells%20it%20when%20it%20falls.%0A%20%20%2A%28%5Brusty-key%5D%28https%3A//github.com/rusty-key%29%29%2A%0A-%20%2A%2ABoss%20stories%20in%20your%20language.%2A%2A%20Every%20story%20is%20now%20written%20in%20German%2C%20French%2C%20Spanish%20%28EU%20and%0A%20%20AL%29%2C%20Portuguese%2C%20Russian%2C%20Korean%20and%20Chinese%20%28Simplified%20and%20Traditional%29%2C%20and%20the%20Bosses%20page%0A%20%20shows%20the%20one%20for%20your%20client%2C%20English%20where%20it%20has%20none.%0A%20%20%2A%28%5Banon1231823%5D%28https%3A//github.com/anon1231823%29%29%2A%0A-%20%2A%2APlaces%20and%20Readables%20are%20reachable%20by%20other%20addons%2A%2A%2C%20through%20the%20globals%20%60SpokenPlaces%60%20and%0A%20%20%60SpokenReadables%60%2C%20as%20Bosses%20already%20is%20through%20%60SpokenBossesAddon%60%3A%20an%20addon%20that%20lists%20a%20place%0A%20%20or%20a%20book%20can%20ask%20whether%20Spoken%20has%20its%20story%20and%20have%20it%20read%20or%20shown.%20Such%20an%20addon%20checks%0A%20%20first%20whether%20the%20player%20has%20found%20it.%0A%20%20%2A%28%5Bfallenguards%5D%28https%3A//github.com/fallenguards%29%29%2A%0A-%20%2A%2ARaid%20and%20world%20bosses%20wear%20the%20elite%20skull%20in%20the%20Compendium%2C%20dungeon%20bosses%20the%20plain%20one.%2A%2A%0A%20%20On%20Season%20of%20Discovery%2C%20Blackfathom%20Deeps%2C%20Gnomeregan%20and%20Sunken%20Temple%20count%20as%20raids.%0A%20%20%2A%28%5Banon1231823%5D%28https%3A//github.com/anon1231823%29%29%2A%0A-%20%2A%2AThe%20Quests%2C%20Readables%20and%20Bosses%20pages%20have%20an%20icon%20before%20anything%20is%20chosen.%2A%2A%20Quests%20shows%0A%20%20its%20scroll%3B%20Readables%20and%20Bosses%20show%20the%20Compendium%27s%20book%2C%20replacing%20the%20dragon%20on%20Bosses.%0A%20%20%2A%28%5Banon1231823%5D%28https%3A//github.com/anon1231823%29%29%2A%0A-%20%2A%2AOn%20Forever%2C%20the%20Contribute%20box%20names%20the%20released%20game%27s%20folder.%2A%2A%20It%20points%20to%0A%20%20%60_forever_%60%20for%20the%20saved%20file%20to%20upload%2C%20instead%20of%20the%20ended%20beta%27s%20%60_classic_beta_%60.%0A%20%20%2A%28%5Bsvengabr%5D%28https%3A//github.com/svengabr%29%29%2A%0A"
